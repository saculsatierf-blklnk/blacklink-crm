<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="28" flood-color="rgba(0,0,0,0.88)" />
    </filter>
    <linearGradient id="card-glass-6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03" />
    </linearGradient>
    <linearGradient id="border-glow-6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.40" />
    </linearGradient>
  </defs>

  <!-- Fundo de Vidro 3D Fosco -->
  <image href="/brand/glass-06-cube.jpg" width="1080" height="1080" preserveAspectRatio="xMidYMid slice" />

  <!-- Pílulas Superiores em Vidro Puro -->
  <g transform="translate(54, 54)">
    <rect width="170" height="40" rx="20" fill="url(#card-glass-6)" stroke="url(#border-glow-6)" stroke-width="1.2" />
    <text x="85" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" letter-spacing="2.5">BLACK LINK</text>
  </g>
  <g transform="translate(896, 54)">
    <rect width="130" height="40" rx="20" fill="url(#card-glass-6)" stroke="url(#border-glow-6)" stroke-width="1.2" />
    <text x="65" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="12" fill="rgba(255,255,255,0.85)" letter-spacing="1.5">blklnk.com</text>
  </g>

  <!-- Card Inferior em Extreme Glassmorphism -->
  <g transform="translate(54, 755)" filter="url(#glow-6)">
    <rect width="972" height="270" rx="28" fill="rgba(8, 8, 12, 0.72)" />
    <rect width="972" height="270" rx="28" fill="url(#card-glass-6)" />
    <rect width="972" height="270" rx="28" stroke="url(#border-glow-6)" stroke-width="1.5" fill="none" />

    <text x="48" y="85" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="-0.5">ESTÉTICA É FILTRO DE CLIENTE.</text>
    <text x="48" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.88)">Comunicação fraca atrai pedinte de desconto e suporte infinito.</text>
    <text x="48" y="184" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500" font-size="22" fill="rgba(255,255,255,0.62)">Design monumental e vidro atraem quem paga à vista sem questionar.</text>

    <g transform="translate(48, 222)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="12" fill="rgba(255,255,255,0.52)" letter-spacing="2">POSICIONAMENTO MONUMENTAL // blklnk.com</text>
    </g>
  </g>
</svg>